    - data:
        code: "import re\n\ndef extract_score(text: str, default: int = 70) -> int:\n\
          \    match = re.search(r'[\"\\']?\\w*_?threat_?score[\"\\']?\\s*:\\s*(\\\
          d{1,3})', str(text), re.IGNORECASE)\n    if match:\n        val = int(match.group(1))\n\
          \        if 0 <= val <= 100:\n            return val\n    numbers = re.findall(r'\\\
          b(\\d{1,3})\\b', str(text))\n    for num in numbers:\n        val = int(num)\n\
          \        if 0 <= val <= 100:\n            return val\n    return default\n\
          \ndef clean_snippet(text: str) -> str:\n    return re.sub(r'```|\\{|\\}',\
          \ '', str(text)).strip()[:280]\n\ndef main(network_str: str = \"\", host_str:\
          \ str = \"\", **kwargs) -> dict:\n    net_input = network_str or kwargs.get(\"\
          network_json\", \"\")\n    host_input = host_str or kwargs.get(\"host_json\"\
          , \"\")\n\n    net_score = extract_score(net_input, 85)\n    host_score\
          \ = extract_score(host_input, 80)\n\n    # 50/50 weighted exploitation index\n\
          \    composite_score = round((net_score * 0.50) + (host_score * 0.50))\n\
          \n    if composite_score >= 80:\n        severity = \"CRITICAL (TIER 3 CONTAINMENT)\"\
          \n        action = \"IMMEDIATE HOST ISOLATION & SESSION REVOCATION REQUIRED\"\
          \n    elif composite_score >= 50:\n        severity = \"ELEVATED (TIER 2\
          \ THREAT)\"\n        action = \"ENHANCED MONITORING & CREDENTIAL ROTATION\
          \ RECOMMENDED\"\n    else:\n        severity = \"LOW / BENIGN (TIER 1)\"\
          \n        action = \"CLOSE ALERT AS FALSE POSITIVE OR ROUTINE SCAN\"\n\n\
          \    report_text = (\n        f\"THREAT EXPLOITATION INDEX: {composite_score}/100\\\
          n\"\n        f\"INCIDENT SEVERITY: {severity}\\n\"\n        f\"CONTAINMENT\
          \ MANDATE: {action}\\n\\n\"\n        f\"SPECIALIST FINDINGS:\\n\"\n    \
          \    f\"[NETWORK TELEMETRY]: {clean_snippet(net_input)}\\n\"\n        f\"\
          [HOST & IDENTITY]: {clean_snippet(host_input)}\"\n    )\n\n    return {\n\
          \        \"report\": report_text\n    }"
