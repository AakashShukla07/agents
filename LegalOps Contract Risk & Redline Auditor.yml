    - data:
        code: "import re\n\ndef extract_score(text: str, default: int = 75) -> int:\n\
          \    match = re.search(r'[\"\\']?\\w*_?risk_?score[\"\\']?\\s*:\\s*(\\d{1,3})',\
          \ str(text), re.IGNORECASE)\n    if match:\n        val = int(match.group(1))\n\
          \        if 0 <= val <= 100:\n            return val\n    numbers = re.findall(r'\\\
          b(\\d{1,3})\\b', str(text))\n    for num in numbers:\n        val = int(num)\n\
          \        if 0 <= val <= 100:\n            return val\n    return default\n\
          \ndef clean_summary(text: str) -> str:\n    cleaned = re.sub(r'```json|```|\\\
          {|\\}', '', str(text)).strip()\n    return cleaned[:250]\n\ndef main(financial_str:\
          \ str = \"\", compliance_str: str = \"\", lockin_str: str = \"\", **kwargs)\
          \ -> dict:\n    f_input = financial_str or kwargs.get(\"financial_json\"\
          , \"\")\n    c_input = compliance_str or kwargs.get(\"compliance_json\"\
          , \"\")\n    l_input = lockin_str or kwargs.get(\"lockin_json\", \"\")\n\
          \n    f_score = extract_score(f_input, 85)\n    c_score = extract_score(c_input,\
          \ 80)\n    l_score = extract_score(l_input, 75)\n\n    composite = round((f_score\
          \ * 0.40) + (c_score * 0.35) + (l_score * 0.25))\n    verdict = \"REVISE\
          \ BEFORE SIGNING\" if composite >= 65 else \"APPROVED\"\n\n    report_text\
          \ = (\n        f\"COMPOSITE RISK INDEX: {composite}/100\\n\"\n        f\"\
          VERDICT: {verdict}\\n\\n\"\n        f\"- Financial Risk Rating: {f_score}/100\\\
          n\"\n        f\"- Compliance Risk Rating: {c_score}/100\\n\"\n        f\"\
          - IP/Lock-in Risk Rating: {l_score}/100\\n\\n\"\n        f\"SPECIALIST FINDINGS:\\\
          n\"\n        f\"[FINANCIAL]: {clean_summary(f_input)}\\n\"\n        f\"\
          [COMPLIANCE]: {clean_summary(c_input)}\\n\"\n        f\"[LOCK-IN]: {clean_summary(l_input)}\"\
          \n    )\n\n    return {\n        \"report\": report_text\n    }"
        code_language: python3
